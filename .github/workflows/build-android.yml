name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v4
        with:
             accept-android-sdk-licenses: true
      - run: npm install
      - run: npm install --no-save typescript
      - run: npx cap add android
      - name: Add native step counter service
        run: |
          cp -R native/android/app/src/main/java/com/healthtracker/app/. android/app/src/main/java/com/healthtracker/app/
          cp native/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R native/android/app/src/main/res/. android/app/src/main/res/
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: health-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
