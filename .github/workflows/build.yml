name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          ZIP=$(ls -1 files*.zip | tail -n 1)
          test -n "$ZIP" || { echo "No files zip in the repo. Upload files.zip first."; exit 1; }
          echo "Using $ZIP"
          unzip -o "$ZIP" -d app
          cd app
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: health-tracker-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
